packages:
  - apps/*
  - packages/*
  - packages/editor/vendor/quarto/*

autoInstallPeers: false

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  electron-winstaller: false
  core-js-pure: false

minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.3.26'
  - '@assistant-ui/react@0.15.27'
  - '@assistant-ui/store@0.3.19'
  - assistant-cloud@0.2.7

# electron-builder uses the cacheMode API introduced in @electron/get 3.1.
overrides:
  # style-to-js 1.0 exposes an object instead of the callable default required by the HAST renderer.
  'hast-util-to-jsx-runtime>style-to-js': 1.1.21
  '@codemirror/state': 6.7.6
  'app-builder-lib@26.15.3>@electron/get': ^3.1.0

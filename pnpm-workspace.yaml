packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.3.26'
  - '@assistant-ui/react@0.15.27'
  - '@assistant-ui/store@0.3.19'
  - assistant-cloud@0.2.7

# electron-builder uses the cacheMode API introduced in @electron/get 3.1.
overrides:
  '@codemirror/state': 6.7.6
  'app-builder-lib@26.15.3>@electron/get': ^3.1.0

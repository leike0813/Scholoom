<!doctype html>
<!-- Temporary UI prototype: four layouts share in-memory example work, switchable via ?variant=. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholoom · 工作台交互草图</title>
<style>
*{box-sizing:border-box} :root{--ink:#292b36;--muted:#737787;--line:#e2e4eb;--accent:#6654c0;--soft:#efedf9;--nav:218px;--aside:310px}
body{margin:0;background:#f7f8fb;color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif} button,input,select,textarea{font:inherit} button,select{cursor:pointer} button{border:1px solid var(--line);background:white;border-radius:6px;padding:5px 11px;color:var(--ink)} button:hover{border-color:var(--accent);background:#faf9ff} button:disabled{opacity:.45;cursor:default} button.primary{background:var(--accent);border-color:var(--accent);color:white} button.active{color:var(--accent);border-color:#bfb6e5;background:var(--soft)} input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:white;color:var(--ink)} :focus-visible{outline:2px solid #9787da;outline-offset:2px}
header{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:white} .brand{font-size:19px;font-weight:700;letter-spacing:-.6px}.brand span{color:var(--accent)}.subtle{color:var(--muted);font-size:12px}.grow{flex:1}.pill{display:inline-block;border-radius:20px;padding:2px 9px;background:var(--soft);color:var(--accent);font-size:12px}.warn{color:#986022;background:#fff4dc}.ok{color:#357661;background:#e9f5ef}.bad{color:#a54e52;background:#fff0ef}
#workspace{display:grid;grid-template-columns:56px var(--nav) minmax(360px,1fr) var(--aside);height:calc(100vh - 265px);min-height:410px;border-bottom:1px solid var(--line)}#workspace.hide-aside{grid-template-columns:56px var(--nav) minmax(360px,1fr)}#workspace.hide-aside #inspector{display:none}.rail{background:#f0f1f6;border-right:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;gap:7px}.rail button{border:none;background:transparent;padding:10px 3px;font-size:12px}.rail button.active{background:var(--soft);color:var(--accent)}#sidebar{border-right:1px solid var(--line);background:#fbfcff;padding:15px 12px;overflow:auto}#canvas{overflow:auto;background:white;padding:23px 27px}#inspector{overflow:auto;background:#fafbfe;border-left:1px solid var(--line);padding:19px 17px}.side-switch{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}.side-switch button{font-size:12px;padding:3px 7px}.nav-item{display:block;width:100%;text-align:left;padding:11px;margin:8px 0;white-space:normal}.nav-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.nav-item.selected{border-color:#beb4e5;background:var(--soft)}h1{font-size:21px;line-height:1.4;margin:2px 0 9px}h2{font-size:16px;margin:21px 0 11px}h3{font-size:13px;margin:14px 0 8px}p{margin:9px 0} .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.card{border:1px solid var(--line);border-radius:9px;padding:14px;margin:12px 0;background:white}.note{border-left:3px solid #b1a4df;background:#f7f5fd;padding:10px 13px;margin:13px 0}.thread{max-width:850px}.message{margin:15px 0;padding:12px 15px;border-radius:8px;background:#f4f5fa}.message.human{background:#f0edf9}.message strong{font-size:12px;color:var(--accent)}details{border:1px solid var(--line);padding:10px 13px;border-radius:7px;margin:11px 0}summary{cursor:pointer}.progress{height:5px;border-radius:5px;background:#eeedf5;margin:10px 0}.progress i{display:block;background:#8e7ecd;height:100%;border-radius:5px}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #d6cfee;border-radius:5px;color:#655392;background:#f7f5fd;padding:2px 7px;font-size:12px}.chip button{border:0;padding:0 3px;background:transparent;color:inherit}.source-title{font-size:16px;font-weight:600}.source-excerpt{font-family:Georgia,"Noto Serif CJK SC",serif;font-size:17px;line-height:1.95;border-left:3px solid #cabf9f;padding:11px 17px;background:#fdfbf5;margin:18px 0}.paper-sheet{padding:21px;border:1px solid #e4e2da;background:#fffefd;min-height:200px}.paper-sheet .subtle{margin-bottom:10px}.meta label{display:block;margin:10px 0;color:var(--muted);font-size:12px}.meta input{width:100%;margin-top:4px;color:var(--ink)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar input{min-width:190px;flex:1}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:500}td button{border:none;padding:0;text-align:left;color:var(--accent)}.split{display:grid;grid-template-columns:minmax(230px,1fr) minmax(220px,.8fr);gap:17px}.manuscript{width:100%;min-height:220px;font-family:Georgia,"Noto Serif CJK SC",serif;font-size:17px;line-height:1.9;resize:vertical;padding:20px}.diff-old{background:#fff0ef;color:#8f4848;padding:11px;border-radius:5px}.diff-new{background:#edf8f0;color:#31674c;padding:11px;border-radius:5px}.change-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.composer{margin:0;padding:12px 24px 14px 78px;background:#fbfcff;border-bottom:1px solid var(--line)}.composer-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px;font-size:12px}.composer-main{display:flex;gap:10px}.composer textarea{width:100%;height:58px;resize:vertical;max-height:130px}.composer-main button{min-width:85px}#statusline{padding:6px 20px;color:var(--muted);font-size:11px;display:flex;gap:14px;flex-wrap:wrap}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;border:1px solid #bab2d6;background:#292637;border-radius:10px;padding:6px 9px;box-shadow:0 5px 20px #29263726;z-index:3;white-space:nowrap}.switcher button{border:0;background:transparent;color:#d5cfe7;font-size:12px}.switcher button.active{background:#6551ae;color:white}.switcher .subtle{color:#aca4c2;padding:0 6px}#toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#302b43;color:white;padding:9px 17px;border-radius:7px;z-index:7;max-width:700px;display:none}.overlay{position:fixed;inset:0;background:#2423305c;z-index:5;display:flex;justify-content:flex-end}.drawer{width:min(530px,95vw);height:100%;padding:25px;background:#fff;overflow:auto;box-shadow:-8px 0 30px #0001}.drawer .nav-item{padding:15px}.layout-controls{position:relative}.layout-controls details{position:absolute;right:0;top:35px;background:white;z-index:4;width:270px;box-shadow:0 5px 20px #0001}.layout-controls details:not([open]){display:none}.layout-controls label{display:block;margin:8px 0}.layout-controls input[type=range]{width:100%}.view-lead{margin-bottom:17px}.muted-list{color:var(--muted);padding-left:20px}.empty{padding:28px 10px;color:var(--muted)}
@media(max-width:1150px){:root{--nav:178px;--aside:250px}#canvas{padding:20px}header{gap:10px}.split{grid-template-columns:1fr}.brand{font-size:17px}}
@media(max-width:850px){#workspace{grid-template-columns:48px 145px minmax(280px,1fr);height:calc(100vh - 300px)}#inspector{display:none}#workspace.hide-aside{grid-template-columns:48px 145px minmax(280px,1fr)}header{padding:0 10px;flex-wrap:wrap;height:auto;min-height:65px}.composer{padding:12px}.switcher{bottom:7px}.switcher .subtle{display:none}#canvas{padding:16px}#sidebar{padding:10px 8px}}
</style>
</head>
<body>
<header>
 <div class="brand">Scho<span>loom</span></div><span class="subtle">交互草图 · 示例工作空间</span>
 <select id="scope" aria-label="工作范围"><option value="project">项目 · 地层泛化研究</option><option value="library">独立文献库</option></select>
 <button data-action="library">文献库</button><span class="grow"></span>
 <div class="layout-controls"><button data-action="layout-menu">布局设置</button><details id="layout-menu"><summary>调整当前布局</summary><label>导航宽度 <input id="nav-width" type="range" min="160" max="300" value="218"></label><label><input id="hide-aside" type="checkbox"> 折叠辅助面板</label><label><input id="split-view" type="checkbox"> 稿件与来源分栏</label><div class="row"><button data-action="save-layout">保存布局</button><button data-action="restore-layout">恢复已存布局</button><button data-action="default-layout">默认布局</button></div></details></div>
 <button data-action="inbox" id="inbox-button">需要你处理</button>
</header>
<div id="workspace">
 <nav class="rail" aria-label="布局入口"><button data-mode="agent">Agent</button><button data-mode="library">文献</button><button data-mode="writing">写作</button><button data-mode="review">审查</button></nav>
 <aside id="sidebar"></aside><main id="canvas"></main><aside id="inspector"></aside>
</div>
<section class="composer" aria-label="Agent 指令">
 <div class="composer-top"><span id="target-label"></span><select id="recipient" aria-label="指令接收 Agent"></select><span class="grow"></span><span class="subtle">附加材料</span><div class="chips" id="attachments"></div></div>
 <div class="composer-main"><textarea id="prompt" aria-label="给 Agent 的指令" placeholder="向当前 Agent 补充指令，或说明下一项工作…"></textarea><button class="primary" data-action="send">发送指令</button></div>
</section>
<div id="statusline"></div>
<nav class="switcher" aria-label="原型布局切换"><span class="subtle">布局</span><button data-action="previous" aria-label="上一布局">←</button><button data-mode="agent">Agent</button><button data-mode="library">文献</button><button data-mode="writing">写作</button><button data-mode="review">审查</button><button data-action="next" aria-label="下一布局">→</button></nav>
<div id="toast" role="status"></div><div id="overlay-root"></div>
<script>
const modes=['agent','library','writing','review'];
const modeNames={agent:'Agent',library:'文献',writing:'写作',review:'审查'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const papers=[
 {id:'a',title:'示例文献 A · 地层预测方法比较',year:'2024',version:1,page:8,excerpt:'该实验采用单一场地数据的留出验证。不同场地的独立验证尚未完成，因此结果的适用范围应保留这一条件。',tags:'方法比较；待核验'},
 {id:'b',title:'示例文献 B · 跨场地验证',year:'2023',version:1,page:5,excerpt:'研究报告了两个场地的独立验证，但地层类型覆盖有限。跨场地结果不等同于任意地层条件下的稳定泛化。',tags:'泛化；独立验证'},
 {id:'c',title:'示例文献 C · 数据集构建',year:'2022',version:1,page:3,excerpt:'数据采集条件、类别覆盖和划分方式共同决定测试结果的解释范围。当前条目尚缺完整附件。',tags:'数据；缺全文'}
];
const initialText='该方法在不同地层条件下具有稳定的泛化能力。\n\n本文采用已有场地数据进行验证，并将方法、结果和适用条件分别讨论。';
const revisedText='在本研究涉及的单一场地留出验证中，该方法表现稳定；其在其他地层与场地条件下的泛化能力仍需进一步验证。\n\n本文采用已有场地数据进行验证，并将方法、结果和适用条件分别讨论。';
const tasks={
 synthesis:{name:'比较泛化验证证据',scope:'project',goal:'比较选定文献的验证条件，形成可用于论文的证据表。',next:'核对跨场地验证与数据划分，明确结论范围。',status:'进行中',agents:['主 Agent','文献分析 worker','证据核对 worker'],progress:5,total:8,used:['a'],attached:[],prompt:'',recipient:'主 Agent',closed:false,messages:[{who:'主 Agent',text:'已整理 5 篇材料的验证条件。文献 A 的结果来自单一场地，拟先将相关主张限定在已有验证范围内。'},{who:'证据核对 worker',text:'下一步将核对跨场地验证，分别记录场地和地层条件，检查其能否支持当前主张。'}]},
 library:{name:'整理长期文献库',scope:'library',goal:'补齐条目信息，找出缺全文材料并形成整理建议。',next:'查看缺全文条目，检查已有标签。',status:'进行中',agents:['主 Agent'],progress:1,total:3,used:['c'],attached:[],prompt:'',recipient:'主 Agent',closed:false,messages:[{who:'主 Agent',text:'已找到一个缺少完整附件的条目。现有内容可用于定位资料，完整精读仍需补齐全文。'}]},
 revision:{name:'回应审稿意见 2',scope:'project',goal:'核对泛化主张的依据，修订正文并准备一致的回复。',next:'审查正文与回复候选，检查实际修改和依据。',status:'待核验',agents:['主 Agent','修订核对 worker'],progress:1,total:3,used:['a','b'],attached:[],prompt:'',recipient:'主 Agent',closed:false,messages:[{who:'主 Agent',text:'拟收窄正文的泛化表述，并说明已有验证的范围。请连同证据与回复一起检查。'}]}
};
const initialVariant=new URLSearchParams(location.search).get('variant');
const state={variant:modes.includes(initialVariant)?initialVariant:'agent',scope:'project',task:'synthesis',nav:'tasks',viewed:'a',query:'',selectedQuote:'',quoteSource:'',manuscript:initialText,draft:initialText,revision:1,proposalBase:1,proposal:revisedText,baseText:initialText,textStatus:'pending',replyStatus:'pending',reply:'',reviewVerified:false,needsDecision:true,missingFulltext:true,hideAside:false,split:false,navWidth:218,savedLayout:null,inbox:false,toastTimer:null};
const task=()=>tasks[state.task];
const paper=()=>papers.find(p=>p.id===state.viewed);
const button=(action,label,extra='')=>`<button data-action="${action}" ${extra}>${label}</button>`;
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.style.display='block';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.style.display='none',2800)}
function setVariant(mode){if(!modes.includes(mode))return;state.variant=mode;if(['file:','http:','https:'].includes(location.protocol)){const u=new URL(location.href);u.searchParams.set('variant',mode);history.replaceState(null,'',u)}render()}
function setTask(id){state.task=id;state.scope=tasks[id].scope;render()}
function attachmentMarkup(){return task().attached.map((a,i)=>`<span class="chip">文献 ${a.id.toUpperCase()} · v${a.version}${a.selection?' · 选段':''}<button data-action="remove-material" data-index="${i}" aria-label="移除此材料">×</button></span>`).join('')||'<span class="subtle">可从阅读材料附加</span>'}
function sourceMarkup(){const p=paper();return `<div class="paper-sheet"><div class="subtle">示例来源 · 材料 v${p.version} · 第 ${p.page} 页</div><div class="source-title">${esc(p.title)}</div><p class="subtle">${p.year} · ${esc(p.tags)}</p><div class="source-excerpt" id="paper-quote">${esc(p.excerpt)}</div><div class="row">${button('attach','附加整篇')}${button('attach-selection','附加选段')}</div></div>`}
function renderSidebar(){let entries='';const visible=Object.entries(tasks).filter(([,t])=>state.scope==='library'?t.scope==='library':t.scope==='project');
 if(state.nav==='tasks')entries=visible.map(([id,t])=>`<button class="nav-item ${state.task===id?'selected':''}" data-action="task" data-id="${id}">${esc(t.name)}<small>${esc(t.status)} · ${t.progress}/${t.total} 项材料／交付</small></button>`).join('');
 if(state.nav==='agents')entries=task().agents.map(a=>`<button class="nav-item ${task().recipient===a?'selected':''}" data-action="agent" data-name="${esc(a)}">${esc(a)}<small>当前关联：${esc(task().name)}</small></button>`).join('');
 if(state.nav==='sessions')entries=`<button class="nav-item selected" data-action="open-session">${esc(task().name)}<small>${task().closed?'会话视图已关闭':'当前交流记录'} · 任务仍可继续</small></button><div class="note subtle">可从持续任务找回材料、产物和此前的交流。</div>`;
 document.querySelector('#sidebar').innerHTML=`<div class="subtle">${state.scope==='library'?'长期文献库':'地层泛化研究'}</div><h3>工作导航</h3><div class="side-switch">${['tasks','agents','sessions'].map((n,i)=>`<button class="${state.nav===n?'active':''}" data-action="nav" data-nav="${n}">${['任务','Agents','会话'][i]}</button>`).join('')}</div>${entries}<h3>科研对象</h3><button class="nav-item" data-action="library">文献与阅读<small>文献库中的 ${papers.length} 篇示例材料</small></button>${state.scope==='project'?`<button class="nav-item" data-mode="writing">主稿<small>当前版本 v${state.revision}${state.draft!==state.manuscript?' · 有编辑草稿':''}</small></button><button class="nav-item" data-mode="review">审稿意见与修改<small>意见 2 · 正文与回复</small></button>`:''}`;
}
function renderAgent(){const t=task();return `<div class="view-lead"><div class="between"><h1>${esc(t.name)}</h1><span class="pill">${esc(t.status)}</span></div><p>${esc(t.goal)}</p><div class="note"><span class="subtle">下一步</span><br>${esc(t.next)}</div></div><div class="row"><span class="subtle">进展 ${t.progress}/${t.total}</span><span class="pill">${esc(t.recipient)}</span>${button('inbox','查看待处理')}${button(t.closed?'open-session':'close-session',t.closed?'重新打开会话':'关闭会话视图')}</div><div class="progress"><i style="width:${t.progress/t.total*100}%"></i></div>${t.closed?'<div class="empty">会话视图已关闭。目标、材料和产物仍可从当前任务查看。</div>':`<div class="thread">${t.messages.map(m=>`<div class="message ${m.human?'human':''}"><strong>${esc(m.who)}</strong><p>${esc(m.text)}</p>${m.materials?`<div class="subtle">本条指令材料：${m.materials}</div>`:''}</div>`).join('')}</div>`}<details><summary>研究计划与执行者</summary>${state.scope==='library'?'<ol><li>检查条目信息与附件</li><li>形成整理建议</li><li>保存可复用的库成果</li></ol>':'<ol><li>比较材料和验证条件</li><li>核对关键主张与证据</li><li>形成论证与修订候选</li></ol>'}<div class="chips">${t.agents.map(a=>`<button data-action="agent" data-name="${esc(a)}">${esc(a)}</button>`).join('')}</div></details><details><summary>工具活动与产物</summary>${state.scope==='library'?'<p>文献整理建议 · 缺全文条目已定位</p>':'<p>验证条件比较表 · 已整理部分材料</p><p>主稿修订候选 · 正文与回复待核验</p>'}<div class="row">${button('library','打开材料')}${state.scope==='project'?button('review-task','打开修改审查'):''}</div></details>`}
function renderLibrary(){const matches=papers.filter(p=>`${p.title} ${p.tags}`.includes(state.query));return `<div class="between"><h1>文献库</h1><span class="pill">${state.scope==='library'?'独立库工作':'从项目查看'}</span></div><p class="subtle">当前指令仍发给：${esc(task().name)} · ${esc(task().recipient)}</p><div class="toolbar"><input id="library-search" aria-label="搜索文献" placeholder="搜索标题或标签" value="${esc(state.query)}">${button('search','搜索')}${button('import','导入示例条目')}${button('library-task','开展独立库任务')}</div><table><thead><tr><th>标题</th><th>年份</th><th>标签</th></tr></thead><tbody>${matches.map(p=>`<tr><td><button data-action="paper" data-id="${p.id}">${esc(p.title)}</button></td><td>${p.year}</td><td>${esc(p.tags)}</td></tr>`).join('')}</tbody></table><h2>正在阅读</h2>${sourceMarkup()}`}
function renderWriting(){if(state.scope==='library')return `<h1>写作</h1><p>当前正在独立文献库工作。选择研究项目后，可以打开其稿件；库任务和材料继续保留。</p>${button('project-writing','打开项目稿件')}`;return `<div class="between"><h1>主稿 · Introduction</h1><span class="pill">v${state.revision}</span></div><p class="subtle">稿件草稿、来源材料与 Agent 工作可以并行查看。</p><div class="toolbar">${button('save-draft','保存正文','class="primary"')}${button('toggle-split',state.split?'收起来源分栏':'与来源分栏')}${button('review-task','审查 Agent 修改')}</div><div class="${state.split?'split':''}"><div><textarea class="manuscript" id="manuscript" aria-label="稿件正文">${esc(state.draft)}</textarea><p class="subtle" id="draft-status">${state.draft===state.manuscript?'正文已保存':'有尚未保存的编辑草稿'}</p><h3>相关主张</h3><div class="note">泛化范围需要与实际验证条件一致。<br><span class="subtle">支持与限制：文献 A 第 8 页，文献 B 第 5 页。</span></div></div>${state.split?sourceMarkup():''}</div>`}
function conflict(){return state.textStatus==='pending'&&(state.proposalBase!==state.revision||state.draft!==state.manuscript)}
function renderReview(){if(state.scope==='library')return `<h1>修改审查</h1><p>当前正在独立文献库工作。项目中的审稿意见可从待处理入口或项目中打开。</p>${button('project-review','打开项目审查')}`;const bad=conflict();return `<div class="between"><h1>审稿意见 2</h1><span class="pill ${state.reviewVerified?'ok':'warn'}">${state.reviewVerified?'示例回应已核验':'整体交付待核验'}</span></div><div class="note">请说明不同地层条件下泛化能力的依据，并使正文与回复保持一致。</div><p class="subtle">工作目的：核对证据与结论范围 · 关联任务：回应审稿意见 2</p><div class="card"><div class="between"><h2 style="margin:0">正文：收窄泛化表述</h2><span class="pill ${state.textStatus==='applied'?'ok':bad?'bad':'warn'}">${state.textStatus==='applied'?'已实际应用':bad?'存在冲突':'待审查'}</span></div><p class="subtle">提案依据 v${state.proposalBase} · 当前正文 v${state.revision}${state.draft!==state.manuscript?' · 另有编辑草稿':''}</p><p><b>理由：</b>已有结果没有覆盖全部地层条件，候选明确单一场地与留出验证的范围。</p><p><b>含义变化：</b>研究主张的适用范围收窄，需要检查关联表述。</p><div class="diff-old"><span class="subtle">提案依据</span><br>${esc(state.baseText)}</div><div class="diff-new"><span class="subtle">候选修改</span><br>${esc(state.proposal)}</div>${bad?`<h3>当前正文${state.draft!==state.manuscript?'与编辑草稿':''}</h3><div class="note">${esc(state.draft)}</div><p class="pill bad">旧提案保留，当前正文不会被覆盖</p>`:''}<div class="change-actions">${button('apply-text','接受正文修改',`class="primary" ${state.textStatus==='applied'?'disabled':''}`)}${button('rebase','请求按当前版本重做')}${button('show-evidence','查看证据')}${button('writing','打开正文')}</div></div><div class="card"><div class="between"><h2 style="margin:0">回复：解释验证范围</h2><span class="pill ${state.replyStatus==='applied'?'ok':'warn'}">${state.replyStatus==='applied'?'已实际应用':'待审查'}</span></div><p>${state.replyStatus==='applied'?esc(state.reply):'拟在正文实际修改后，说明已收窄表述，并明确现有验证范围。'}</p><div class="change-actions">${button('apply-reply','接受回复修改',`${state.replyStatus==='applied'?'disabled':''}`)}${button('show-evidence','查看依据')}</div></div><div class="card"><span class="pill ok">已授权应用</span><h3>参考文献：补齐对应条目</h3><p>文献 B 已关联到引用清单，可从来源查看材料。</p></div><div class="note">正文与回复分别记录应用情况，整体交付仍需核验依据与回应是否充分。</div>${button('verify-review','核对整体回应',`${state.reviewVerified?'disabled':''}`)}`}
function renderInspector(){const p=paper(),t=task();if(state.variant==='library'){return `<h3>条目信息</h3><div class="meta"><label>标题<input id="meta-title" value="${esc(p.titleDraft??p.title)}"></label><label>标签<input id="meta-tags" value="${esc(p.tagsDraft??p.tags)}"></label>${button('save-meta','保存元数据')}</div><h3>阅读批注</h3><textarea id="annotation" aria-label="阅读批注" placeholder="记录材料的适用条件…" style="width:100%;height:90px">${esc(p.annotationDraft??p.annotation??'')}</textarea>${button('save-annotation','保存批注')}<h3>材料位置</h3><p class="subtle">材料 v${p.version} · 第 ${p.page} 页</p><h3>当前任务已读取</h3><div class="chips">${t.used.map(id=>`<span class="chip">文献 ${id.toUpperCase()} · v1</span>`).join('')}</div>`}if(state.scope==='library')return `<h3>库任务材料</h3><p>${esc(p.title)}</p><p>${esc(p.excerpt)}</p>${button('attach','附加材料')}<h3>当前任务已读取</h3><div class="chips">${t.used.map(id=>`<span class="chip">文献 ${id.toUpperCase()} · v1</span>`).join('')}</div>${button('library','查看文献库')}`;return `<h3>${state.variant==='agent'?'相关材料':'Agent 与证据'}</h3><p class="subtle">正在浏览：文献 ${p.id.toUpperCase()} · v${p.version}</p><p>${esc(p.title)}</p><div class="source-excerpt" style="font-size:14px">${esc(p.excerpt)}</div><div class="row">${button('attach','附加材料')}${button('library','打开来源')}</div><h3>当前任务已读取</h3><div class="chips">${t.used.map(id=>`<span class="chip">文献 ${id.toUpperCase()} · v1</span>`).join('')}</div><h3>当前工作</h3><p>${esc(t.name)}</p><p class="subtle">接收者：${esc(t.recipient)}</p>${button('agent-view','打开 Agent 工作页')}<h3>产物与检查</h3><p class="subtle">正文 ${state.textStatus==='applied'?'已应用':'待审查'} · 回复 ${state.replyStatus==='applied'?'已应用':'待审查'}</p>${button('review-task','查看修订依据')}`}
function attentionItems(){const list=[];if(state.needsDecision)list.push({id:'decision',task:'synthesis',scope:'project',label:'正式决定 · 确认泛化表述范围',description:'现有证据以单一场地与有限覆盖为主。'});if(!state.reviewVerified)list.push({id:'review',task:'revision',scope:'project',label:conflict()?'修改冲突 · 正文与回复':state.textStatus==='applied'&&state.replyStatus==='applied'?'交付核验 · 审稿意见 2':'修改审查 · 正文与回复',description:`正文 ${state.textStatus==='applied'?'已应用':'待处理'}，回复 ${state.replyStatus==='applied'?'已应用':'待处理'}；整体回应待核验。`});if(state.missingFulltext)list.push({id:'missing',task:'library',scope:'library',label:'需要材料 · 示例文献 C 缺全文',description:'整理结果已保留，完整精读仍依赖全文。'});return list}
function renderInbox(filter='all'){if(!state.inbox){document.querySelector('#overlay-root').innerHTML='';return}const list=attentionItems().filter(i=>filter==='all'||i.scope===filter);document.querySelector('#overlay-root').innerHTML=`<div class="overlay"><div class="drawer"><div class="between"><h1>需要你处理</h1>${button('close-inbox','关闭')}</div><select id="inbox-filter" aria-label="待处理范围"><option value="all" ${filter==='all'?'selected':''}>全部工作</option><option value="project" ${filter==='project'?'selected':''}>地层泛化研究</option><option value="library" ${filter==='library'?'selected':''}>长期文献库</option></select>${list.length?list.map(i=>`<button class="nav-item" data-action="attention" data-id="${i.id}">${esc(i.label)}<small>${i.scope==='library'?'长期文献库':'地层泛化研究'} · ${esc(i.description)}</small></button>`).join(''):'<p class="empty">当前范围没有待处理事项。</p>'}<p class="subtle">各项工作可回到对应任务、来源或修改审查。</p></div></div>`}
function render(){
 document.querySelector('#scope').value=state.scope;document.documentElement.style.setProperty('--nav',state.navWidth+'px');document.querySelector('#workspace').classList.toggle('hide-aside',state.hideAside);
 document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('active',el.dataset.mode===state.variant));document.querySelector('#hide-aside').checked=state.hideAside;document.querySelector('#split-view').checked=state.split;document.querySelector('#nav-width').value=state.navWidth;
 renderSidebar();document.querySelector('#canvas').innerHTML=({agent:renderAgent,library:renderLibrary,writing:renderWriting,review:renderReview}[state.variant])();document.querySelector('#inspector').innerHTML=renderInspector();
 document.querySelector('#target-label').textContent=`指令目标：${task().name}`;document.querySelector('#recipient').innerHTML=task().agents.map(a=>`<option ${task().recipient===a?'selected':''}>${esc(a)}</option>`).join('');document.querySelector('#attachments').innerHTML=attachmentMarkup();document.querySelector('#prompt').value=task().prompt;
 document.querySelector('#statusline').innerHTML=`<span>布局：${modeNames[state.variant]}</span><span>工作范围：${state.scope==='library'?'独立文献库':'地层泛化研究'}</span><span>浏览：文献 ${state.viewed.toUpperCase()}</span><span>正文：v${state.revision}${state.draft!==state.manuscript?' · 有草稿':''}</span><span>任务：${esc(task().status)}</span>`;
 document.querySelector('#inbox-button').textContent=`需要你处理 · ${attentionItems().length}`;renderInbox();
}
function attach(selection=false){const p=paper(),quote=selection?(state.quoteSource===p.id&&state.selectedQuote?state.selectedQuote:p.excerpt):'';if(task().attached.some(a=>a.id===p.id&&a.selection===quote)){toast('材料已附加');return}task().attached.push({id:p.id,version:p.version,selection:quote});render();toast(selection?'已附加选段，发送前可查看目标任务':'已附加材料，发送前可查看目标任务')}
document.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el)return;if(el.dataset.mode){setVariant(el.dataset.mode);return}const a=el.dataset.action;
 if(a==='previous'||a==='next'){setVariant(modes[(modes.indexOf(state.variant)+(a==='next'?1:3))%4]);return}
 if(a==='nav'){state.nav=el.dataset.nav;render()}
 if(a==='task'){setTask(el.dataset.id);setVariant('agent')}
 if(a==='agent'){task().recipient=el.dataset.name;task().closed=false;state.nav='agents';setVariant('agent')}
 if(a==='library'){setVariant('library')}
 if(a==='library-task'){setTask('library');setVariant('agent')}
 if(a==='agent-view'){setVariant('agent')}
 if(a==='writing'){setVariant('writing')}
 if(a==='project-writing'){setTask('synthesis');setVariant('writing')}
 if(a==='project-review'){setTask('revision');setVariant('review')}
 if(a==='paper'){state.viewed=el.dataset.id;state.selectedQuote='';state.quoteSource='';render()}
 if(a==='attach'||a==='attach-selection'){attach(a==='attach-selection')}
 if(a==='remove-material'){task().attached.splice(Number(el.dataset.index),1);render()}
 if(a==='send'){if(!task().prompt.trim()){toast('先输入指令');return}const materials=task().attached.map(m=>`文献 ${m.id.toUpperCase()} · v${m.version}${m.selection?' · 选段':''}`).join('、');task().messages.push({who:'你 → '+task().recipient,text:task().prompt,human:true,materials:esc(materials)||'本条指令没有新增附加材料'});task().prompt='';task().closed=false;render();toast('指令已加入当前任务交流记录')}
 if(a==='close-session'){task().closed=true;render();toast('会话视图已关闭，任务与产物保持可见')}
 if(a==='open-session'){task().closed=false;setVariant('agent')}
 if(a==='save-draft'){if(state.draft===state.manuscript){toast('正文没有新修改');return}state.manuscript=state.draft;state.revision++;state.reviewVerified=false;tasks.revision.status='待核验';render();toast('正文已保存为 v'+state.revision+'，修改提案仍保留其依据版本')}
 if(a==='toggle-split'){state.split=!state.split;render()}
 if(a==='review-task'){setTask('revision');setVariant('review')}
 if(a==='apply-text'){if(conflict()){toast('当前正文或草稿已变化，请检查冲突并按当前版本重做');render();return}state.manuscript=state.proposal;state.draft=state.proposal;state.revision++;state.textStatus='applied';render();toast('正文修改已应用，回复与整体交付仍需检查')}
 if(a==='rebase'){if(state.textStatus==='applied'){toast('正文修改已经应用，可继续检查回复');return}if(state.draft!==state.manuscript){toast('先保存或整理正文草稿，再按当前版本重做');return}const phrase='该方法在不同地层条件下具有稳定的泛化能力。';if(!state.manuscript.includes(phrase)){toast('当前正文已改变相关表述，需要重新判断修改内容');return}state.baseText=state.manuscript;state.proposalBase=state.revision;state.proposal=state.manuscript.replace(phrase,revisedText.split('\n')[0]);render();toast('已生成基于当前正文的示例候选，手工改动保持保留')}
 if(a==='apply-reply'){if(state.textStatus!=='applied'){toast('先核对并实际应用正文，再确认回复中的修改声明');return}state.reply='感谢审稿人的建议。稿件已将表述限定为本研究涉及的单一场地留出验证，并明确其他场地与地层条件仍需进一步验证。';state.replyStatus='applied';render();toast('回复修改已应用，整体交付仍待核验')}
 if(a==='verify-review'){if(state.textStatus!=='applied'||state.replyStatus!=='applied'||state.draft!==state.manuscript){toast('正文、回复与当前草稿尚未一致，请先处理相关事项');return}state.reviewVerified=true;tasks.revision.status='已核验';tasks.revision.progress=3;render();toast('已核对示例回应与修改记录')}
 if(a==='show-evidence'){state.viewed='a';state.hideAside=false;render();toast('证据定位：文献 A 第 8 页，材料 v1')}
 if(a==='search'){state.query=document.querySelector('#library-search').value;render()}
 if(a==='import'){if(papers.some(p=>p.id==='d')){toast('示例条目已经导入');return}papers.push({id:'d',title:'示例文献 D · 补充验证材料',year:'2025',version:1,page:2,excerpt:'补充验证需要明确测试对象、条件及结果范围。',tags:'待整理'});state.viewed='d';render();toast('示例条目已加入当前文献库')}
 if(a==='save-meta'){paper().title=document.querySelector('#meta-title').value;paper().tags=document.querySelector('#meta-tags').value;delete paper().titleDraft;delete paper().tagsDraft;render();toast('条目信息已更新')}
 if(a==='save-annotation'){paper().annotation=document.querySelector('#annotation').value;delete paper().annotationDraft;toast('批注已保留在当前材料')}
 if(a==='layout-menu'){document.querySelector('#layout-menu').open=!document.querySelector('#layout-menu').open}
 if(a==='save-layout'){state.savedLayout={variant:state.variant,hideAside:state.hideAside,split:state.split,navWidth:state.navWidth};toast('当前布局已保存，可在本次演示中恢复')}
 if(a==='restore-layout'){if(!state.savedLayout){toast('先保存一套布局');return}Object.assign(state,state.savedLayout);setVariant(state.variant);toast('已恢复保存的布局，当前工作保持连续')}
 if(a==='default-layout'){state.hideAside=false;state.split=false;state.navWidth=218;setVariant('agent')}
 if(a==='inbox'){state.inbox=true;renderInbox()}
 if(a==='close-inbox'){state.inbox=false;renderInbox()}
 if(a==='attention'){const item=attentionItems().find(i=>i.id===el.dataset.id);if(!item)return;state.inbox=false;setTask(item.task);setVariant(item.id==='review'?'review':item.id==='missing'?'library':'agent');if(item.id==='missing'){state.viewed='c';render()}if(item.id==='decision'){document.querySelector('#canvas').insertAdjacentHTML('afterbegin',`<div class="card"><h3>待决定：论证采用的范围</h3><p>是否保持现有验证范围，明确其他地层与场地条件尚待验证？</p>${button('confirm-decision','确认范围并继续','class="primary"')}</div>`)}}
 if(a==='confirm-decision'){state.needsDecision=false;task().messages.push({who:'研究决定',text:'保持已有验证范围，明确其他条件尚待验证。'});render();toast('范围决定已记录在示例任务中')}
});
document.addEventListener('input',e=>{if(e.target.id==='prompt')task().prompt=e.target.value;if(e.target.id==='manuscript'){state.draft=e.target.value;document.querySelector('#draft-status').textContent=state.draft===state.manuscript?'正文已保存':'有尚未保存的编辑草稿'}if(e.target.id==='meta-title')paper().titleDraft=e.target.value;if(e.target.id==='meta-tags')paper().tagsDraft=e.target.value;if(e.target.id==='annotation')paper().annotationDraft=e.target.value;if(e.target.id==='nav-width'){state.navWidth=Number(e.target.value);document.documentElement.style.setProperty('--nav',state.navWidth+'px')}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){setTask(e.target.value==='library'?'library':'synthesis')}if(e.target.id==='recipient'){task().recipient=e.target.value;render()}if(e.target.id==='hide-aside'){state.hideAside=e.target.checked;render()}if(e.target.id==='split-view'){state.split=e.target.checked;render()}if(e.target.id==='inbox-filter')renderInbox(e.target.value)});
document.querySelector('#canvas').addEventListener('mouseup',()=>{const s=getSelection(),quote=document.querySelector('#paper-quote');if(s&&quote&&quote.contains(s.anchorNode)&&quote.contains(s.focusNode)&&s.toString().trim()){state.selectedQuote=s.toString().trim();state.quoteSource=state.viewed}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.inbox=false;renderInbox();return}if(e.key==='Enter'&&e.target.id==='library-search'){state.query=e.target.value;render();return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setVariant(modes[(modes.indexOf(state.variant)+(e.key==='ArrowRight'?1:3))%4])}});
render();
</script>
</body>
</html>

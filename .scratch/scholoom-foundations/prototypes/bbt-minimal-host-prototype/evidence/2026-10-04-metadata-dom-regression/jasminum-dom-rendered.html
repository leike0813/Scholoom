<!DOCTYPE html><html><head><meta charset="utf-8"><title>Throwaway plugin DOM host</title></head><body></body><style id="prompt-style"><br>      .prompt-container * {<br>        box-sizing: border-box;<br>      }<br>      .prompt-container {<br>        ---radius---: 10px;<br>        position: fixed;<br>        left: 25%;<br>        top: 10%;<br>        width: 50%;<br>        border-radius: var(---radius---);<br>        display: flex;<br>        flex-direction: column;<br>        justify-content: center;<br>        align-items: center;<br>        font-size: 18px;<br>        box-shadow: 0px 1.8px 7.3px rgba(0, 0, 0, 0.071),<br>                    0px 6.3px 24.7px rgba(0, 0, 0, 0.112),<br>                    0px 30px 90px rgba(0, 0, 0, 0.2);<br>        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Microsoft YaHei Light", sans-serif;<br>        background-color: var(--material-background) !important;<br>        border: var(--material-border-quarternary) !important;<br>      }<br>      <br>      /* input */<br>      .prompt-container .input-container  {<br>        width: 100%;<br>      }<br><br>      .input-container input {<br>        width: -moz-available;<br>        height: 40px;<br>        padding: 24px;<br>        border: none;<br>        outline: none;<br>        font-size: 18px;<br>        margin: 0 !important;<br>        border-radius: var(---radius---);<br>        background-color: var(--material-background);<br>      }<br>      <br>      .input-container .cta {<br>        border-bottom: var(--material-border-quarternary);<br>        margin: 5px auto;<br>      }<br>      <br>      /* results */<br>      .commands-containers {<br>        width: 100%;<br>        height: 100%;<br>      }<br>      .commands-container {<br>        max-height: calc(12 * 35.5px);<br>        width: calc(100% - 12px);<br>        margin-left: 12px;<br>        margin-right: 0%;<br>        overflow-y: auto;<br>        overflow-x: hidden;<br>      }<br>      <br>      .commands-container .command {<br>        display: flex;<br>        align-content: baseline;<br>        justify-content: space-between;<br>        border-radius: 5px;<br>        padding: 6px 12px;<br>        margin-right: 12px;<br>        margin-top: 2px;<br>        margin-bottom: 2px;<br>      }<br>      .commands-container .command .content {<br>        display: flex;<br>        width: 100%;<br>        justify-content: space-between;<br>        flex-direction: row;<br>        overflow: hidden;<br>      }<br>      .commands-container .command .content .name {<br>        white-space: nowrap; <br>        text-overflow: ellipsis;<br>        overflow: hidden;<br>      }<br>      .commands-container .command .content .aux {<br>        display: flex;<br>        align-items: center;<br>        align-self: center;<br>        flex-shrink: 0;<br>      }<br>      <br>      .commands-container .command .content .aux .label {<br>        font-size: 15px;<br>        color: var(--fill-primary);<br>        padding: 2px 6px;<br>        background-color: var(--color-background);<br>        border-radius: 5px;<br>      }<br>      <br>      .commands-container .selected {<br>          background-color: var(--material-mix-quinary);<br>      }<br><br>      .commands-container .highlight {<br>        font-weight: bold;<br>      }<br><br>      .tip {<br>        color: var(--fill-primary);<br>        text-align: center;<br>        padding: 12px 12px;<br>        font-size: 18px;<br>      }<br><br>      /* instructions */<br>      .instructions {<br>        display: flex;<br>        align-content: center;<br>        justify-content: center;<br>        font-size: 15px;<br>        height: 2.5em;<br>        width: 100%;<br>        border-top: var(--material-border-quarternary);<br>        color: var(--fill-secondary);<br>        margin-top: 5px;<br>      }<br>      <br>      .instructions .instruction {<br>        margin: auto .5em;  <br>      }<br>      <br>      .instructions .key {<br>        margin-right: .2em;<br>        font-weight: 600;<br>      }<br>    </style><div style="display: none;"><div style="position: fixed; left: 0px; top: 0px; background-color: transparent; width: 100%; height: 100%;"></div><div id="zotero-plugin-toolkit-prompt" class="prompt-container"><div class="input-container"><input type="text" placeholder="Select a command..." class="prompt-input"><div class="cta"></div></div><div class="commands-containers"></div><div class="instructions"><div class="instruction"><span class="key">↑↓</span><span>to navigate</span></div><div class="instruction"><span class="key">enter</span><span>to trigger</span></div><div class="instruction"><span class="key">esc</span><span>to exit</span></div></div></div></div></html>

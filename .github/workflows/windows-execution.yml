name: Windows execution diagnosis

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/windows-execution.yml
      - tests/execution-diagnostics.ts
      - tests/kernel/context-instructions.spec.ts
      - tests/kernel/agent-delegation.spec.ts
      - tests/kernel/literature-attachment-integration.spec.ts
      - tests/kernel/host-connection.spec.ts
      - tests/fixtures/zotero-host/fixed-host.mjs
      - tests/isolated-kernel.ts
      - tests/kernel-fixture.ts
      - tests/kernel/isolated-kernel.spec.ts
      - tests/kernel/isolated-startup-acl.spec.ts
      - tests/kernel/private-files.spec.ts
      - packages/platform/src/private-files.ts
      - packages/harness/package.json
      - packages/harness/src/execution-driver.ts
      - apps/kernel/src/execution-worker.ts
      - apps/kernel/src/execution-graphs.ts
      - tests/fixtures/isolated-kernel-acl.mjs
      - tests/fixtures/isolated-kernel-process.mjs
      - tests/fixtures/isolated-kernel-diagnostic.mjs
      - tests/kernel/lifecycle.spec.ts
      - tests/kernel/platform-availability.spec.ts
      - tests/kernel/harness.spec.ts
      - tests/kernel/development-execution.spec.ts
      - tests/kernel/managed-commands.spec.ts
      - tests/kernel/platform-processes.spec.ts
      - tests/smoke/entrypoints.spec.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-files:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm --config.optimisticRepeatInstall=false install --frozen-lockfile
      - run: pnpm --config.optimisticRepeatInstall=false build:shared
      - name: Record the exact Node and libuv versions
        run: node -p 'JSON.stringify({platform:process.platform,node:process.version,uv:process.versions.uv})'
      - name: Observe repeated directory ACL metadata without retries
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/private-files.spec.ts --workers=1 --repeat-each=3 --reporter=list --output test-results/windows-private-files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-private-files-metadata
          path: test-results/windows-private-files/
          if-no-files-found: warn
  execution:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SCHOOLOOM_EXECUTION_DIAGNOSTICS: '1'
      PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/execution-report
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm --config.optimisticRepeatInstall=false install --frozen-lockfile
      - run: pnpm --config.optimisticRepeatInstall=false build:shared
      - name: Repeat the failing execution paths without retries
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/context-instructions.spec.ts tests/kernel/harness.spec.ts --grep 'a later basis upgrade|Agent structure tools' --repeat-each 5 --reporter=list,html --output test-results/windows-execution
      - name: Verify native ownership and command authorization
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/platform-processes.spec.ts tests/kernel/managed-commands.spec.ts --output test-results/windows-ownership
      - name: Verify delivered host mutations retain uncertainty
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/host-connection.spec.ts --workers=1 --output test-results/windows-host
      - name: Verify lock and unavailable execution observations
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/lifecycle.spec.ts tests/kernel/platform-availability.spec.ts --grep 'occupied configuration preserves|kernel declares|child process observation|unavailable execution refuses' --workers=1 --output test-results/windows-availability
      - name: Observe isolated kernel startup and owned-child cleanup
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/isolated-kernel.spec.ts --workers=1 --output test-results/windows-isolated-kernel
      - name: Compare real private directory ACL environments after isolated startup
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/isolated-startup-acl.spec.ts --workers=1 --output test-results/windows-isolated-acl
      - name: Preserve startup evidence before the remaining checks
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: test-results/
      - name: Observe cancellation setup excerpts and attachment reader
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/agent-delegation.spec.ts tests/kernel/context-instructions.spec.ts tests/kernel/literature-attachment-integration.spec.ts --grep 'cancelling a child|real worker sends explicit excerpts|real RPC and Agent share material bytes' --workers=1 --output test-results/windows-agent
      - name: Check development owner lifecycle
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test --config playwright.kernel.config.ts tests/kernel/development-execution.spec.ts --output test-results/windows-owner
      - name: Build the desktop entrypoint
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false --filter @scholoom/desktop build
      - name: Prepare Electron
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false setup:electron
      - name: Repeat initial Electron loading
        if: '!cancelled()'
        run: pnpm --config.optimisticRepeatInstall=false exec playwright test tests/smoke/entrypoints.spec.ts --grep 'desktop loads React' --repeat-each 3 --reporter=list,html --output test-results/windows-desktop
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/desktop-report
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: windows-execution-diagnostics
          path: test-results/

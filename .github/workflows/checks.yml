name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:ui --with-deps
        if: runner.os == 'Linux'
      - run: pnpm setup:ui
        if: runner.os != 'Linux'
      - run: pnpm lint
      - run: pnpm check:architecture
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate native process ownership
        if: runner.os != 'macOS'
        run: pnpm exec playwright test --config playwright.kernel.config.ts tests/kernel/platform-processes.spec.ts tests/kernel/managed-commands.spec.ts --output test-results/process-ownership
      - uses: quarto-dev/quarto-actions/setup@v2
        if: runner.os != 'macOS'
        with:
          version: '1.9.37'
      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os != 'macOS'
      - name: Update TeX Live manager
        if: runner.os != 'macOS'
        run: tlmgr update --self
      - name: Install writing TeX packages
        if: runner.os != 'macOS'
        run: tlmgr install latexmk caption
      - name: Report writing toolchain
        if: runner.os != 'macOS'
        run: |
          quarto --version
          quarto pandoc --version
          latexmk -v
          pdflatex --version
          xelatex --version
          kpsewhich caption.sty
      - run: pnpm test:kernel
        if: runner.os != 'macOS'
      - name: Validate macOS unavailable execution and manual fallback
        if: runner.os == 'macOS'
        run: pnpm exec playwright test --config playwright.kernel.config.ts tests/kernel/platform-availability.spec.ts
      - run: xvfb-run -a pnpm test:smoke
        if: runner.os == 'Linux'
      - run: pnpm test:smoke
        if: runner.os == 'Windows'
      - name: Validate macOS application entrypoints
        if: runner.os == 'macOS'
        run: pnpm setup:electron && pnpm exec playwright test tests/smoke/entrypoints.spec.ts
      - run: xvfb-run -a pnpm test:ui
        if: runner.os == 'Linux'
      - run: pnpm test:ui
        if: runner.os == 'Windows'
      - name: Validate macOS manual workbench in both hosts
        if: runner.os == 'macOS'
        run: pnpm test:ui tests/ui/platform-availability.spec.ts tests/ui/library.spec.ts
      - run: pnpm package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results/

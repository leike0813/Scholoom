name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:ui --with-deps
        if: runner.os == 'Linux'
      - run: pnpm setup:ui
        if: runner.os != 'Linux'
      - run: pnpm lint
      - run: pnpm check:architecture
      - run: pnpm typecheck
      - run: pnpm build
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Update TeX Live manager
        run: tlmgr update --self
      - name: Install latexmk
        run: tlmgr install latexmk
      - name: Report writing toolchain
        run: |
          quarto --version
          quarto pandoc --version
          latexmk -v
          pdflatex --version
          xelatex --version
      - run: pnpm test:kernel
      - run: xvfb-run -a pnpm test:smoke
        if: runner.os == 'Linux'
      - run: pnpm test:smoke
        if: runner.os != 'Linux'
      - run: xvfb-run -a pnpm test:ui
        if: runner.os == 'Linux'
      - run: pnpm test:ui
        if: runner.os != 'Linux'
      - run: pnpm package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results/
